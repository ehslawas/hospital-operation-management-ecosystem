<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <pattern id="cross" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M44 18v52M18 44h52" stroke="#3ba5d0" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="ekg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.55"/>
