  </defs>

  <rect width="1920" height="1080" fill="url(#wash)"/>
  <rect width="1920" height="1080" fill="url(#cross)" opacity="0.7"/>

  <!-- Elegant ECG line along lower third -->
  <polyline
    points="0,700 140,660 240,720 360,610 520,690 680,620 820,700 980,640 1140,710 1300,630 1480,700 1640,650 1800,720 1920,680"
