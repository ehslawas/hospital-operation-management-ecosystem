<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Very soft blue/teal gradient wash -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ecfeff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Subtle medical cross pattern -->
    <pattern id="plus" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 8v32M8 24h32" stroke="#0ea5e9" stroke-opacity="0.30" stroke-width="1"/>
    </pattern>

    <!-- Subtle hex/molecule motif -->
    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse">
      <path d="M14 0l14 8.1v16.2l-14 8.1-14-8.1V8.1L14 0z" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Gentle wash -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Patterns layered for depth -->
  <rect width="1920" height="1080" fill="url(#plus)"/>
  <rect width="1920" height="1080" fill="url(#hex)"/>

  <!-- Faint EKG line -->
  <polyline points="0,700 150,650 300,720 450,610 600,690 750,620 900,700 1050,640 1200,710 1350,630 1500,700 1650,650 1800,720 1920,680"
            fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>
</svg>


